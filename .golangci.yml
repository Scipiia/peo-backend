version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
  exclusions:
    rules:
      - path: internal/service/generate-excel/
        linters:
          - errcheck
          - "-QF1003"  # tagged switch suggestion
          - "-QF1008"  # embedded field selector
          - "-QF1011"  # redundant type in var decl
          - "-S1002"   # == true/false comparison