host: localhost:8080
info:
  contact: {}
  description: API для расчёта трудовых норм и учёта производственных заказов
  title: Сервис нормирования API
  version: "1.0"
paths:
  /api/admin//coefficient/update:
    put:
      consumes:
      - application/json
      parameters:
      - description: Список коэффициентов
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/storage.CoefficientPEOAdmin'
          type: array
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: ошибка парсинга JSON
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Обновить соэффициент
      tags:
      - admin
  /api/admin/all_templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.Template'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить все json шаблоны операции
      tags:
      - admin
  /api/admin/coefficient:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Список коэффициентов
          schema:
            items:
              $ref: '#/definitions/storage.CoefficientPEOAdmin'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить коэффициенты
      tags:
      - admin
  /api/admin/employees:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.EmployeesAdmin'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить сотрудников
      tags:
      - admin
  /api/admin/employees/teams:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.TeamAdmin'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить бригады
      tags:
      - admin
  /api/admin/employees/update/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID сотрудника
        in: path
        name: id
        required: true
        type: integer
      - description: Данные сотрудника
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/storage.UpdateEmployeeInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Неверный JSON или ID
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Обновить сотрудника
      tags:
      - admin
  /api/admin/template:
    get:
      parameters:
      - description: ID шаблона
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/storage.Template'
        "400":
          description: Missing or invalid query parameter 'id'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить json шаблон операции
      tags:
      - admin
  /api/admin/template/new:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные нового шаблона
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/save.TemplateAdminSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ошибка парсинга JSON
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Сохранить новый шаблон
      tags:
      - admin
  /api/admin/template/update/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: id шаблона
        in: path
        name: id
        required: true
        type: string
      - description: Обновленные данные нового шаблона
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/update.TemplateAdminUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ошибка парсинга JSON
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Обновить новый шаблон
      tags:
      - admin
  /api/all_final_order:
    get:
      parameters:
      - description: Дата начала периода (YYYY-MM-DD), по умолчанию — начало текущего
          месяца
        in: query
        name: from
        type: string
      - description: Дата окончания периода (YYYY-MM-DD), по умолчанию — конец текущего
          месяца
        in: query
        name: to
        type: string
      - description: Номер заказа
        in: query
        name: order_num
        type: string
      - collectionFormat: multi
        description: Типы изделий (можно указать несколько)
        in: query
        items:
          type: string
        name: type
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/get.FinalReportResponse'
        "400":
          description: Неверный формат даты 'from' или 'to'
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Получить данные финального отчёта ПЭО
      tags:
      - norm-orders
  /api/all_templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.Template'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить все json шаблоны операции
      tags:
      - template
  /api/final/update/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID заказа для обновления
        in: path
        name: id
        required: true
        type: integer
      - description: Обновлённые данные по заказу
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/storage.UpdateFinalOrderDetails'
      produces:
      - application/json
      responses:
        "204":
          description: Успешно обновлено
        "400":
          description: Invalid request body
          schema:
            type: string
        "500":
          description: Ошибка обновления
          schema:
            type: string
      summary: Обновить детали заказа
      tags:
      - norm-orders
  /api/materials/calculation:
    post:
      consumes:
      - application/json
      parameters:
      - description: Параметры для пересчета норм
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/recalculate_norm.RecalculateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/recalculate_norm.Resp'
        "400":
          description: Неверные данные
          schema:
            type: string
        "500":
          description: не удалось пересчитать нормы
          schema:
            type: string
      summary: Сохранить новые операции
      tags:
      - recalculate
  /api/orders:
    get:
      parameters:
      - description: Год (обязателен, если не указан search)
        in: query
        name: year
        type: integer
      - description: Месяц (обязателен, если не указан search)
        in: query
        name: month
        type: integer
      - description: Поиск по номеру заказа (если указан — year/month не нужны)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.Order'
            type: array
        "400":
          description: Missing year or month / Invalid year / Invalid month
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить заказы
      tags:
      - orders
  /api/orders/{id}/vitr-assign:
    get:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.GetWorkersVitrage'
            type: array
        "400":
          description: Invalid ID
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Получить данные по витражам
      tags:
      - norm-orders
  /api/orders/{orderNum}:
    get:
      parameters:
      - description: Номер заказа
        in: path
        name: orderNum
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/storage.ResultOrderDetails'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Получить детали заказа по номеру
      tags:
      - orders
  /api/orders/cancel:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID корневого изделия
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/update.CancelStatusRequest'
      produces:
      - application/json
      responses:
        "204":
